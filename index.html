
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모던블랙 Modern Black</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fefefe;
      color: #222;
    }
    header {
      background-color: #1e1e1e;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.8rem;
      margin: 0;
    }
    nav a {
      color: white;
      margin-left: 1.5rem;
      text-decoration: none;
      font-size: 1rem;
    }
    .hero {
      background-image: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93');
      background-size: cover;
      background-position: center;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 1px 1px 3px #000;
    }
    .hero h2 {
      font-size: 2rem;
      text-align: center;
    }
    .products {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      background-color: #fff;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h3 {
      margin: 0.5rem 0;
    }
    .product p {
      font-size: 0.9rem;
      color: #555;
    }
    .product button {
      background-color: #1e1e1e;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      cursor: pointer;
      border-radius: 5px;
    }
    .subscribe {
      padding: 2rem;
      background-color: #f5f5f5;
      text-align: center;
    }
    .subscribe input {
      padding: 0.5rem;
      width: 200px;
      margin-right: 1rem;
    }
    .subscribe button {
      padding: 0.5rem 1rem;
      background-color: #222;
      color: white;
      border: none;
      cursor: pointer;
    }
    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
    }
    @media (max-width: 600px) {
      .hero h2 {
        font-size: 1.5rem;
        padding: 0 1rem;
      }
      header h1 {
        font-size: 1.2rem;
      }
      nav a {
        display: inline-block;
        margin: 0.5rem 1rem 0 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>모던블랙</h1>
    <nav>
      <a href="#">홈</a>
      <a href="#">원두</a>
      <a href="#">정기구독</a>
      <a href="#">문의</a>
    </nav>
  </header>
  <div class="hero">
    <h2>스페셜티 커피, 정직하게 볶다</h2>
  </div>
  <section class="products">
    <div class="product">
      <img src="https://source.unsplash.com/250x200/?coffee,bean" alt="원두1">
      <h3>에티오피아 내추럴</h3>
      <p>과일 향 가득, 산뜻한 산미</p>
      <button>자세히 보기</button>
    </div>
    <div class="product">
      <img src="https://source.unsplash.com/250x200/?coffee,bags" alt="원두2">
      <h3>콜롬비아 수프리모</h3>
      <p>견과류의 고소함과 밸런스</p>
      <button>자세히 보기</button>
    </div>
    <div class="product">
      <img src="https://source.unsplash.com/250x200/?coffee,cup" alt="원두3">
      <h3>과테말라 안티구아</h3>
      <p>쌉싸름한 초콜릿과 스파이스</p>
      <button>자세히 보기</button>
    </div>
  </section>
  <section class="subscribe">
    <h3>정기구독 신청</h3>
    <p>매달 새로운 원두를 집으로 배송받아보세요.</p>
    <input type="email" placeholder="이메일 입력">
    <button>신청하기</button>
  </section>
  <footer>
    &copy; 2025 모던블랙. 모든 권리 보유.
  </footer>
</body>
</html>
